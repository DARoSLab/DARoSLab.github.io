<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="566" viewBox="0 0 1100 566" role="img" aria-labelledby="title desc">
<title id="title">Parallel temporal chunks and optional refinement</title><desc id="desc">A motion is divided into nominal temporal chunks with configurable context overlaps. Independent workers initialize their chunks, use boosted SQP iterations on initial frames, and switch to Real-Time Iteration. Results are merged in frame order, optionally blended in overlap regions, and optionally refined by detecting velocity and acceleration spikes and re-solving affected groups. The diagram is schematic and does not show measured execution times.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-labelledby="title desc">
<title id="title">Optional contact-implicit dynamics validation</title><desc id="desc">A kinematic reference is tracked with a contact-implicit iLQR controller. Actuator-bounded controls are evaluated in MuJoCo with full rigid-body dynamics and simulated contacts. State rollouts feed back to the optimizer, supporting simulation-based trackability assessment and contact refinement. This is a conceptual research-stage schematic, not a claim that this stage is included in the public code release.</desc>

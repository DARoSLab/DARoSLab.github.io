<svg xmlns="http://www.w3.org/2000/svg" width="960" height="142" viewBox="0 0 960 142" role="img" aria-labelledby="pipeline-title pipeline-desc">
          <title id="pipeline-title">FRDV pipeline overview</title><desc id="pipeline-desc">Human motion capture is aligned to a robot, retargeted using the kinematic pipeline (code coming soon), optionally validated with contact-implicit iLQR, then used for policy training and hardware deployment. Dynamics validation is described in the paper but will not be included in the planned code release.</desc>
          <defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="#8b9198"/></marker></defs>
          <g stroke="#d7dce1" stroke-width="1.2"><rect x="1" y="17" width="204" height="101" rx="6" fill="#f5f6f8"/><rect x="249" y="17" width="213" height="101" rx="6" fill="#eef4f8"/><rect x="506" y="17" width="213" height="101" rx="6" fill="#f8f6ef" stroke-dasharray="5 4"/><rect x="763" y="17" width="196" height="101" rx="6" fill="#f0f5ef"/></g>
          <g stroke="#8b9198" stroke-width="1.3" marker-end="url(#arrowhead)"><path d="M213 67h27"/><path d="M470 67h27"/><path d="M727 67h27"/></g>
          <g fill="#2c333b" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle"><text x="103" y="51" font-weight="600">Human MoCap</text><text x="355" y="51" font-weight="600">Kinematic retargeting</text><text x="612" y="51" font-weight="600">Dynamics validation</text><text x="861" y="51" font-weight="600">Learning &amp; deployment</text></g>
          <g fill="#707780" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle"><text x="103" y="77">Scale, align, and map sites</text><text x="355" y="77">SQP + RTI + parallel chunks</text><text x="355" y="98" font-size="10">Code coming soon</text><text x="612" y="77">Contact-implicit iLQR · optional</text><text x="612" y="98" font-size="10">Not included in the planned release</text><text x="861" y="77">Motion-tracking RL → hardware</text></g>
        </svg>
